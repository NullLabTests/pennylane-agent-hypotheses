<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/><stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/><stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/><stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/><stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="bold">🔄 Research Methodology Pipeline</text>
  <line x1="100" y1="48" x2="700" y2="48" stroke="#334155" stroke-width="1"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="150" height="100" rx="12" fill="url(#step1)"/>
    <text x="105" y="110" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24">📋</text>
    <text x="105" y="135" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Hypothesis</text>
    <text x="105" y="152" text-anchor="middle" fill="#ddd6fe" font-family="Arial,sans-serif" font-size="10">Definition</text>
  </g>
  <text x="105" y="200" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Research question</text>
  <text x="105" y="214" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Novelty rationale</text>
  <text x="105" y="228" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Expected metrics</text>

  <!-- Arrow 1→2 -->
  <text x="200" y="130" fill="#475569" font-family="Arial,sans-serif" font-size="20">→</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="230" y="80" width="150" height="100" rx="12" fill="url(#step2)"/>
    <text x="305" y="110" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24">🐍</text>
    <text x="305" y="135" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Implementation</text>
    <text x="305" y="152" text-anchor="middle" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="10">Python Scripts</text>
  </g>
  <text x="305" y="200" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• PennyLane circuits</text>
  <text x="305" y="214" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Baseline demos</text>
  <text x="305" y="228" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• CLI argument parsing</text>

  <!-- Arrow 2→3 -->
  <text x="400" y="130" fill="#475569" font-family="Arial,sans-serif" font-size="20">→</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="430" y="80" width="150" height="100" rx="12" fill="url(#step3)"/>
    <text x="505" y="110" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24">📓</text>
    <text x="505" y="135" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Execution</text>
    <text x="505" y="152" text-anchor="middle" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="10">Notebooks + CI</text>
  </g>
  <text x="505" y="200" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Jupyter notebooks</text>
  <text x="505" y="214" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• YAML configs</text>
  <text x="505" y="228" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• CI smoke tests</text>

  <!-- Arrow 3→4 -->
  <text x="600" y="130" fill="#475569" font-family="Arial,sans-serif" font-size="20">→</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="630" y="80" width="150" height="100" rx="12" fill="url(#step4)"/>
    <text x="705" y="110" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24">📊</text>
    <text x="705" y="135" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Validation</text>
    <text x="705" y="152" text-anchor="middle" fill="#fde68a" font-family="Arial,sans-serif" font-size="10">Results + Report</text>
  </g>
  <text x="705" y="200" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Metric comparison</text>
  <text x="705" y="214" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Pareto analysis</text>
  <text x="705" y="228" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">• Hypothesis check</text>

  <!-- Bottom: Repository mapping -->
  <line x1="50" y1="260" x2="750" y2="260" stroke="#334155" stroke-width="1"/>
  <text x="400" y="282" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Repository Mapping</text>

  <rect x="60" y="300" width="160" height="36" rx="8" fill="#1a1a2e" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="140" y="323" text-anchor="middle" fill="#00d4aa" font-family="Arial,sans-serif" font-size="11" font-weight="bold">agent-hypotheses</text>

  <rect x="260" y="300" width="160" height="36" rx="8" fill="#1a1a2e" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="340" y="323" text-anchor="middle" fill="#7C3AED" font-family="Arial,sans-serif" font-size="11" font-weight="bold">pennylane-demos</text>

  <rect x="460" y="300" width="160" height="36" rx="8" fill="#1a1a2e" stroke="#10B981" stroke-width="1.5"/>
  <text x="540" y="323" text-anchor="middle" fill="#10B981" font-family="Arial,sans-serif" font-size="11" font-weight="bold">agent-experiments</text>

  <rect x="660" y="300" width="100" height="36" rx="8" fill="#1a1a2e" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="710" y="323" text-anchor="middle" fill="#F59E0B" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Results</text>

  <text x="400" y="365" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="9">Each step feeds into the next: definition → code → run → validate, with results looping back to refine hypotheses</text>
  <text x="400" y="383" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="9">The three repositories form a complete research-to-execution pipeline</text>
</svg>
